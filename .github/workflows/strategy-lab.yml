name: Five-hour strategy lab
on:
  schedule:
    - cron: '17 */5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: read
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Diagnose losses, walk-forward test strategies, gate adoption
        env:
          PAPER_STATE_KEY: ${{ secrets.PAPER_STATE_KEY }}
        run: node scripts/strategy-lab.mjs
      - name: Save lab report and configs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in strategy-lab.json paper.json portfolio.enc.json; do
            if [ -f "data/$file" ]; then git add "data/$file"; fi
          done
          if ! git diff --cached --quiet; then git commit -m 'Five-hour strategy lab report'; git push; fi
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/wait-pages-artifact.mjs
      - uses: actions/deploy-pages@v4
        id: deployment
