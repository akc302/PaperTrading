name: Update paper account

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: read
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Refresh public candles, simulate fills, and review daily
        env:
          PAPER_STATE_KEY: ${{ secrets.PAPER_STATE_KEY }}
        run: node scripts/update-market.mjs
      - name: Record actual timer evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GH_REPO/actions/workflows/update.yml/runs?event=schedule&per_page=1" --jq '.total_count')
          runs=$(gh api "repos/$GH_REPO/actions/workflows/update.yml/runs?event=schedule&per_page=6" --jq '[.workflow_runs[] | {createdAt:.created_at,status,conclusion}]')
          SCHEDULE_RUNS="$runs" SCHEDULE_COUNT="$count" node --input-type=module -e "import{writeFileSync}from'node:fs';const runs=JSON.parse(process.env.SCHEDULE_RUNS),times=runs.filter(r=>r.conclusion==='success').map(r=>Date.parse(r.createdAt)).slice(0,3),verified=times.length===3&&Date.now()-times[0]<900000&&times.slice(1).every((t,i)=>times[i]-t<=600000);writeFileSync('data/operations.json',JSON.stringify({updatedAt:new Date().toISOString(),triggerEvent:process.env.TRIGGER_EVENT,scheduleEventCount:Number(process.env.SCHEDULE_COUNT),fiveMinuteCadenceVerified:verified,recentScheduledRuns:runs,note:'A configured cron is not proof of a running timer. Independent hourly fallback is configured separately.'},null,2)+'\n');"
      - name: Save paper account and transparent research history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/paper.json data/reviews.json data/operations.json
          if [ -f data/learning.json ]; then git add data/learning.json; fi
          for paper_state_file in data/portfolio.enc.json data/private-status.json; do
            if [ -f "$paper_state_file" ]; then git add "$paper_state_file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper account and market research'
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for uploaded Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo 'Uploaded Pages artifact did not become visible; refusing to publish stale output.'
          exit 1
      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
