name: Update paper account

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Refresh public candles, simulate fills, and review daily
        env:
          PAPER_STATE_KEY: ${{ secrets.PAPER_STATE_KEY }}
        run: node scripts/update-market.mjs
      - name: Save paper account and transparent research history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/paper.json data/reviews.json
          for paper_state_file in data/portfolio.enc.json data/private-status.json; do
            if [ -f "$paper_state_file" ]; then git add "$paper_state_file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper account and market research'
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
